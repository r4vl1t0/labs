<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal de cuenta</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <h1>Portal de cuenta</h1>
      <p>Acceso a datos personales y servicios internos.</p>
    </header>
    <main>
      <div class="tabs">
        <a class="active" href="/lab4-session.html">Sesion</a>
        <a href="/">Inicio</a>
      </div>
      <div class="layout">
        <section class="panel">
          <h2>Acceso</h2>
          <form id="login-form">
            <label>Usuario
              <input name="username" autocomplete="username" required>
            </label>
            <label>Clave
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Ingresar</button>
          </form>
          <h3 style="margin-top:18px">Estado de sesion</h3>
          <div id="session-status" class="status">Cargando sesion.</div>
        </section>
        <section class="panel">
          <h2>Cuenta</h2>
          <div class="toolbar">
            <button id="account-btn" type="button">Ver cuenta</button>
            <button id="session-btn" class="secondary" type="button">Actualizar sesion</button>
          </div>
          <div id="main-status" class="status">Sin actividad.</div>
        </section>
      </div>
    </main>
    <script src="/app.js"></script>
    <script>bindSessionLab();</script>
  </body>
</html>
