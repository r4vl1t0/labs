<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperacion de cuenta</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <h1>Recuperacion de cuenta</h1>
      <p>Portal administrativo de soporte y validacion de identidad.</p>
    </header>
    <main>
      <div class="tabs">
        <a class="active" href="/lab3-reset.html">Recuperacion</a>
        <a href="/">Inicio</a>
      </div>
      <div class="layout">
        <section class="panel">
          <h2>Iniciar sesion</h2>
          <form id="login-form">
            <label>Usuario
              <input name="username" autocomplete="username" required>
            </label>
            <label>Clave
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Ingresar</button>
          </form>
          <h2 style="margin-top:24px">Olvide mi clave</h2>
          <form id="forgot-form">
            <label>Usuario
              <input name="username" required>
            </label>
            <button type="submit">Enviar codigo</button>
          </form>
          <form id="reset-form">
            <label>Usuario
              <input name="username" required>
            </label>
            <label>Codigo
              <input name="otp" inputmode="numeric" maxlength="4" required>
            </label>
            <label>Nueva clave
              <input name="newPassword" type="password" required>
            </label>
            <button type="submit">Actualizar clave</button>
          </form>
          <div id="reset-status" class="status">Sin solicitud.</div>
        </section>
        <section class="panel">
          <h2>Administracion</h2>
          <div class="toolbar">
            <button id="admin-btn" type="button">Abrir consola</button>
          </div>
          <div id="main-status" class="status">Sin actividad.</div>
          <h3 style="margin-top:18px">Sesion</h3>
          <div id="token-box" class="status token-box">Sin sesion.</div>
        </section>
      </div>
    </main>
    <script src="/app.js"></script>
    <script>bindResetLab();</script>
  </body>
</html>
