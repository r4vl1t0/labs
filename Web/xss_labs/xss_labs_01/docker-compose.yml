version: "3.8"

services:
  xss-labs:
    image: php:8.2-apache
    container_name: xss-labs
    ports:
      - "8090:80"
    volumes:
      - ./www:/var/www/html
    # Permite que PHP escriba los archivos de "comentarios" de los labs
    # de XSS almacenado (solo para fines educativos / entorno aislado).
    command: >
      bash -c "apache2-foreground"
    restart: unless-stopped
