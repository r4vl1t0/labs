<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bienvenida — Modo Profesor (DOM XSS)</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="banner profesor">MODO PROFESOR — XSS DOM-based (Lab 3/6)</div>
<div class="container">
  <p><a href="/">&larr; volver al índice</a></p>
  <h1>Página de bienvenida</h1>
  <p class="hint">
    Objetivo de la demo: mostrar que la vulnerabilidad puede existir
    <strong>100% en el navegador</strong>, sin que el servidor procese
    el dato inyectado (no hay ningún request al backend con el payload).
  </p>

  <p>Bienvenido, <span id="saludo"></span></p>

<script>
  const params = new URLSearchParams(location.search);
  const nombre = params.get('nombre') || 'invitado';
  // VULNERABLE: sink innerHTML con dato controlado por el usuario (source: URL)
  document.getElementById('saludo').innerHTML = nombre;
</script>
</body>
</html>
